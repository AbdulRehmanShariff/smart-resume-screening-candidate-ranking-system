[pytest]
# ---- Test Discovery ----
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ---- Output ----
# Show short test summary for failures and errors
addopts =
    -v
    --tb=short
    --strict-markers

# ---- Custom Markers ----
markers =
    unit: Pure unit tests with no external dependencies
    integration: Tests that require a live database connection
    slow: Tests that take more than 1 second to run

# ---- Warnings ----
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
